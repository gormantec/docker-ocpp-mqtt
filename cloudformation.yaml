AWSTemplateFormatVersion: "2010-09-09"
Description: OCPP-to-MQTT Bridge — Infrastructure (Networking)
Metadata: {}
Parameters:
  MQTT_CA_CERT_B64:
    Type: String
    Default: '{{resolve:secretsmanager:gormantec.com/MQTT_CA_CERT_B64:SecretString}}'
    NoEcho: true
  MQTT_CLIENT_CERT_B64:
    Type: String
    Default: '{{resolve:secretsmanager:gormantec.com/MQTT_CLIENT_CERT_B64:SecretString}}'
    NoEcho: true
  MQTT_CLIENT_KEY_B64:
    Type: String
    Default: '{{resolve:secretsmanager:gormantec.com/MQTT_CLIENT_KEY_B64:SecretString}}'
    NoEcho: true
  MQTT_BROKER:
    Type: String
    Default: docker-iot_server
  MQTT_PORT:
    Type: String
    Default: '8883'
  MQTT_TRANSPORT:
    Type: String
    Default: tcp
  MQTT_THING_NAME:
    Type: String
    Default: gormantec-ocpp-bridge
  OCPP_HOST:
    Type: String
    Default: 0.0.0.0
  OCPP_PORT:
    Type: String
    Default: '9000'
  OCPP_WS_PATH:
    Type: String
    Default: '/{charge_point_id}'
  UI_PORT:
    Type: String
    Default: '9094'
  DOCDB_URL:
    Type: String
    Default: http://ocpp-mqtt-docdb-proxy:5984
    Description: CouchDB endpoint for schedule persistence
  DOCDB_REDIS_DB:
    Type: String
    Default: "3"
  DOCDB_USER:
    Type: String
    Default: admin
  DOCDB_PASSWORD:
    Type: String
    Default: '{{resolve:secretsmanager:gormantec.com/DOCDB_PASSWORD:SecretString}}'
    NoEcho: true
  DOCDB_DB:
    Type: String
    Default: ocpp_mqtt
    Description: Dedicated OCPP DocumentDB database name
  ESY_THING_NAME:
    Type: String
    Default: gormantec-battery1
    Description: MQTT thing name for esy-sunhomes telemetry
Resources:
  DocDBPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: DOCDB_PASSWORD
      Description: DocumentDB master password (from SECRET_DOCDB_PASSWORD)
  OcppAuroraCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      # Aurora stores all OCPP historic/time-series data. Singleton state
      # (schedules, cpstate, site:metrics) stays in DocumentDB.
      Engine: aurora-mysql
      EngineMode: serverless
      DatabaseName: ocpp_mqtt
      Port: 3306
      StorageEncrypted: true
  OcppAuroraRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ocpp-mqtt-aurora
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      # Provisions a least-privilege MySQL user scoped to ocpp_mqtt and injects
      # AURORA_HOST/PORT/USERNAME/PASSWORD/DATABASE into the task definition.
      AuroraAccess:
        Databases:
          - ocpp_mqtt
        Privileges: ReadWrite
  OcppDocDBProxyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ocpp-mqtt-docdb-proxy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      RedisAccess:
        Database: 3
        KeyPatterns:
          - "ocpp_mqtt:*"
          - "db:ocpp_mqtt"
  OcppDocDBProxyTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Metadata:
      IoTCoreLite:
        SecretsGroup: gormantec.com
    Properties:
      Family: ocpp-mqtt-docdb-proxy-acl
      Cpu: "128"
      Memory: "128"
      NetworkMode: bridge
      TaskRoleArn: !GetAtt OcppDocDBProxyRole.Arn
      ContainerDefinitions:
        - Name: docdb-proxy
          Image: ghcr.io/gormantec/docker-documentdb:proxy
          PortMappings:
            - ContainerPort: "5984"
          Environment:
            - Name: DOCDB_REDIS_HOST
              Value: 192.168.8.14
            - Name: DOCDB_REDIS_PORT
              Value: "6379"
            - Name: DOCDB_REDIS_DB
              Value:
                Ref: DOCDB_REDIS_DB
            - Name: DOCDB_HTTP_USER
              Value:
                Ref: DOCDB_USER
            - Name: DOCDB_HTTP_PASSWORD
              Value:
                Ref: DOCDB_PASSWORD
            - Name: DOCDB_STUB_PORT
              Value: "0"
      _restartPolicy: unless-stopped
  OcppDocDBProxyService:
    Type: AWS::ECS::Service
    DependsOn: OcppDocDBProxyTaskDefinition
    Properties:
      ServiceName: ocpp-mqtt-docdb-proxy
      TaskDefinition: !Ref OcppDocDBProxyTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkAlias: ocpp-mqtt-docdb-proxy
      InternalOnly: true
  OcppMqttLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/ocpp-mqtt
      RetentionInDays: 30
  OcppMqttTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Metadata:
      IoTCoreLite:
        _injectFromCompose: true
    Properties:
      Family: ocpp-mqtt-redis
      Cpu: "256"
      Memory: "512"
      NetworkMode: bridge
      TaskRoleArn: !GetAtt OcppAuroraRole.Arn
      ContainerDefinitions:
        - Name: ocpp-mqtt
          Image: ghcr.io/gormantec/docker-ocpp-mqtt:latest
          PortMappings:
            - ContainerPort: "9000"
            - ContainerPort: "9094"
          Environment:
            - Name: MQTT_BROKER
              Value:
                Ref: MQTT_BROKER
            - Name: MQTT_PORT
              Value:
                Ref: MQTT_PORT
            - Name: MQTT_TRANSPORT
              Value:
                Ref: MQTT_TRANSPORT
            - Name: MQTT_THING_NAME
              Value:
                Ref: MQTT_THING_NAME
            - Name: MQTT_CA_CERT_B64
              Value:
                Ref: MQTT_CA_CERT_B64
            - Name: MQTT_CLIENT_CERT_B64
              Value:
                Ref: MQTT_CLIENT_CERT_B64
            - Name: MQTT_CLIENT_KEY_B64
              Value:
                Ref: MQTT_CLIENT_KEY_B64
            - Name: OCPP_HOST
              Value:
                Ref: OCPP_HOST
            - Name: OCPP_PORT
              Value:
                Ref: OCPP_PORT
            - Name: OCPP_WS_PATH
              Value:
                Ref: OCPP_WS_PATH
            - Name: UI_PORT
              Value:
                Ref: UI_PORT
            - Name: DOCDB_URL
              Value:
                Ref: DOCDB_URL
            - Name: DOCDB_USER
              Value:
                Ref: DOCDB_USER
            - Name: DOCDB_PASSWORD
              Value:
                Ref: DOCDB_PASSWORD
            - Name: DOCDB_DB
              Value:
                Ref: DOCDB_DB
            - Name: ESY_THING_NAME
              Value:
                Ref: ESY_THING_NAME
      _restartPolicy: unless-stopped
  OcppMqttService:
    Type: AWS::ECS::Service
    DependsOn: OcppDocDBProxyService
    Properties:
      ServiceName: ocpp-mqtt
      TaskDefinition: !Ref OcppMqttTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      # NAS volumes are only mounted on the Swarm manager. Keep the service on
      # any manager node rather than a specific hostname.
      PlacementConstraints:
        - Type: distinctInstance
          Expression: node.hostname == docker-two
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkAlias: ecs-ocpp-mqtt
      InternalOnly: false
  OcppMqttWebapp:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: webapp
      PathPattern: /webapp/ocpp-mqtt/*
      Priority: 10
      Actions:
        - Type: forward
          TargetService: ocpp-mqtt
          TargetPort: 9000
Outputs:
  LogGroup:
    Description: CloudWatch Log Group for container logs
    Value: /ecs/ocpp-mqtt
  DocDBEndpoint:
    Description: Redis-backed DocumentDB-compatible proxy URL
    Value:
      Ref: DOCDB_URL
  DocDBPasswordSecretArn:
    Description: ARN of the DOCDB_PASSWORD secret
    Value: !Ref DocDBPasswordSecret
